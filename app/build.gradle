plugins {
    id 'com.android.application'
}

android {
    namespace 'br.senai.sp.emendaai'
    compileSdk 34

    defaultConfig {
        applicationId "br.senai.sp.emendaai"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // --- Novidade da semana 6 ---------------------------------------------
    // retrofit        : transforma a interface anotada em cliente HTTP.
    // converter-gson  : converte o JSON da resposta em objeto Java.
    // logging-interceptor : imprime no Logcat a URL chamada e o codigo HTTP.
    //                       Nao e obrigatorio, mas economiza muito chute.
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
}
